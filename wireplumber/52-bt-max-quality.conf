# Maid BT: pin the A2DP codec ladder (LDAC first) + unlock SBC-XQ.
#
# PipeWire picks among the codecs the headset offers. This sets the
# preference order: LDAC, AAC, high-bitpool SBC (XQ), stock SBC last.
# SBC-XQ (~450 kbit/s) is audibly closer to AAC/LDAC than stock SBC
# (~330 kbit/s); SBC-XQ stays off unless enabled here.
# Needs an LDAC/AAC-capable headset; missing codecs are skipped, so
# harmless otherwise. Pair with QUALITY_LOCK=1 in bluetooth-buds.conf
# to enforce LDAC after every switch; this file sets the ladder it
# falls back down when LDAC drops.
# installed opt-in by install.sh, safe to copy by hand.
#
# 2026-10: this PC's controller stalls LDAC packets (wireplumber journal
# floods with "Missing completion reports for packet ... Bluetooth
# adapter firmware bug?") - the buds go silent mid-play, links die, and
# wireplumber can even dump core. LDAC is removed from the offered set
# until that is fixed upstream; AAC + SBC-XQ carry the sound today.
# To bring LDAC back on a healthy adapter, add ldac to the list again.
monitor.bluez.properties = {
  bluez5.codecs = [ aac sbc_xq sbc ]
  bluez5.enable-sbc-xq = true
}
