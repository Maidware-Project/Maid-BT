# Maid BT: enable LE Audio (BAP/LC3) support for Bluetooth audio devices.
#
# Opt-in companion for LE_AUDIO=1 setups. Requires BlueZ/PipeWire/WirePlumber
# with LE Audio support, compatible adapter/controller, and LE Audio earbuds.
# Keep 53-bt-a2dp-only.conf disabled/removed when using this, or dual-mode
# devices may be forced to classic A2DP only.
#
# Installed opt-in by install.sh, safe to copy/symlink by hand.
monitor.bluez.properties = {
  bluez5.enable-le-audio = true
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hsp_ag hfp_hf hfp_ag ]
  bluez5.codecs = [ lc3 aac sbc_xq sbc ]
}
