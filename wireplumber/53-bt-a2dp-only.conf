# Maid BT: lock the buds to classic A2DP - skip LE Audio transport.

# Dual-mode earbuds (A2DP + LE Audio) get LE Audio transports tried first on
# newer stacks; on adapters without working ISO sockets those transports
# fail ("Failure in Bluetooth audio transport") and the buds go silent
# even while classic A2DP is fine. The 0000184e Audio Stream Control UUID
# on an affected pair is exactly that LE Audio service.
monitor.bluez.properties = {
  bluez5.enable-le-audio = false
}
