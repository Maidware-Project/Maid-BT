# Maid BT: keep Bluetooth audio transports warm (no auto-suspend).
#
# PipeWire suspends idle BT nodes to save power, which cuts the first
# ~1s of audio after silence. Setting the suspend timeout to 0 keeps the
# link warm: playback starts instantly. Small battery cost on the earbuds.
# Installed opt-in by install.sh, safe to symlink/copy by hand.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" },
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
